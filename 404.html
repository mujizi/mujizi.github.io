      (() => {
        const journey = document.querySelector('[data-journey-root]');
        if (!journey) return;

        const initialSection = journey.getAttribute('data-initial-section');
        const navLinks = [...document.querySelectorAll('[data-journey-nav]')];
        const sections = [...document.querySelectorAll('[data-journey-section]')];

        const activate = (slug, updateUrl = true) => {
          navLinks.forEach((link) => {
            const current = link.getAttribute('data-journey-nav') === slug;
            link.classList.toggle('active', current);
            if (current) link.setAttribute('aria-current', 'location');
            else link.removeAttribute('aria-current');
          });

          if (!updateUrl) return;
          const nextUrl = slug === 'home' ? '/' : `/#${slug}`;
          if (`${location.pathname}${location.hash}` !== nextUrl) {
            history.replaceState(history.state, '', nextUrl);
          }
        };

        const requestedSection = initialSection || location.hash.slice(1);
        if (requestedSection) {
          if (initialSection) history.replaceState(history.state, '', `/#${initialSection}`);
          requestAnimationFrame(() => requestAnimationFrame(() => {
            document.getElementById(requestedSection)?.scrollIntoView({ block: 'start', behavior: 'instant' });
          }));
        }

        const syncActiveSection = () => {
          const marker = Math.min(innerHeight * .34, 320) + 8;
          let current = sections[0];
          sections.forEach((section) => {
            if (section.getBoundingClientRect().top <= marker) current = section;
          });
          activate(current?.getAttribute('data-journey-section') || 'home');
        };

        let ticking = false;
        const requestSync = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            syncActiveSection();
            ticking = false;
          });
        };

        const observer = new IntersectionObserver(() => {
          requestSync();
        }, {
          rootMargin: '-18% 0px -58% 0px',
          threshold: [0, .05, .2]
        });

        sections.forEach((section) => observer.observe(section));
        window.addEventListener('scroll', requestSync, { passive: true });
        window.addEventListener('resize', requestSync, { passive: true });
        activate(requestedSection || 'home', false);
      })();
    </script> </body> </html>
